<!DOCTYPE html>
<html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experiment 11 - Loops & Conditionals</title>
</head>
<body>
<script>
console.log("=== Experiment 11: Loops & Conditionals ===\n");
// 1. Print numbers 1 to 10 using a for loop
console.log("1. Numbers 1 to 10:");
for (let i = 1; i <= 10; i++) {
console.log(i);
}
console.log("\n");
// 2. Find sum of first n natural numbers using while loop
let n = 10;
let sum = 0;
let counter = 1;
while (counter <= n) {
sum += counter;
counter++;
}
console.log("2. Sum of first", n, "natural numbers:", sum, "\n");
// 3. Print multiplication table of a given number
let num = 5;
console.log("3. Multiplication Table of", num);
for (let i = 1; i <= 10; i++) {
console.log(`${num} x ${i} = ${num * i}`);
}
console.log("\n");
// 4. Calculate factorial of a number using loop
let factNum = 6;
let factorial = 1;
for (let i = 1; i <= factNum; i++) {
factorial *= i;
}
console.log("4. Factorial of", factNum, "is:", factorial, "\n");
// 5. Print all even numbers from 1 to 50
console.log("5. Even numbers from 1 to 50:");
for (let i = 1; i <= 50; i++) {
if (i % 2 === 0) console.log(i);
}
console.log("\n");
// 6. Print all odd numbers from 1 to 50
console.log("6. Odd numbers from 1 to 50:");
for (let i = 1; i <= 50; i++) {
if (i % 2 !== 0) console.log(i);
}
console.log("\n=== End of Experiment 11 ===");
</script>
</body>
</html>
