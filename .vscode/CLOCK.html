<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="CLOCK.css">
  <title>Theme Clock</title>
  <style>
    * {
  box-sizing: border-box;
}

:root {
  --bg: #ef1010;
  --text: #111111;
  --clock-bg: #18df4a;
}

html {
  transition: background-color 0.3s ease, color 0.3s ease;
}

html.dark {
  --bg: rgb(46, 23, 221);
  --text: #ffffff;
  --clock-bg: #1d1d1d;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.toggle {
  position: absolute;
  top: 20px;
  right: 20px;
  border: none;
  border-radius: 6px;
  padding: 8px 12px;
  cursor: pointer;
  background: var(--text);
  color: var(--bg);
}

.clock {
  position: relative;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: var(--clock-bg);
  border: 4px solid var(--text);
}

.number {
  position: absolute;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 700;
}

.n12 { top: 10px; left: 126px; }
.n1 { top: 22px; left: 188px; }
.n2 { top: 60px; left: 228px; }
.n3 { top: 126px; left: 242px; }
.n4 { top: 192px; left: 228px; }
.n5 { top: 230px; left: 188px; }
.n6 { top: 242px; left: 126px; }
.n7 { top: 230px; left: 64px; }
.n8 { top: 192px; left: 24px; }
.n9 { top: 126px; left: 10px; }
.n10 { top: 60px; left: 20px; }
.n11 { top: 22px; left: 62px; }

.needle {
  position: absolute;
  top: 50%;
  left: 50%;
  transform-origin: bottom center;
  transform: translate(-50%, -100%) rotate(0deg);
  border-radius: 4px;
}

.hour {
  width: 6px;
  height: 70px;
  background: var(--text);
}

.minute {
  width: 4px;
  height: 100px;
  background: var(--text);
}

.second {
  width: 2px;
  height: 110px;
  background: #e63946;
}

.center-point {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: #e63946;
}

.time {
  font-size: 28px;
  font-weight: 700;
}

.date {
  font-size: 14px;
}

.date .circle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  margin-left: 6px;
  background: var(--text);
  color: var(--bg);
}

  </style>
</head>
<body>
  <button class="toggle">Dark mode</button>
  <div class="clock-container">
    <div class="clock">
      <span class="number n1">1</span>
      <span class="number n2">2</span>
      <span class="number n3">3</span>
      <span class="number n4">4</span>
      <span class="number n5">5</span>
      <span class="number n6">6</span>
      <span class="number n7">7</span>
      <span class="number n8">8</span>
      <span class="number n9">9</span>
      <span class="number n10">10</span>
      <span class="number n11">11</span>
      <span class="number n12">12</span>
      <div class="needle hour"></div>
      <div class="needle minute"></div>
      <div class="needle second"></div>
      <div class="center-point"></div>
    </div>
  </div>
  <div class="time"></div>
  <div class="date"></div>
  <script src="CLOCK.js"></script>
</body>
</html>
